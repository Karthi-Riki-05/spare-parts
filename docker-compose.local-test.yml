# Local test override — ports only. Use alongside docker-compose.prod.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.local-test.yml up -d
#
# Changes port 80 → 3000 so the test can coexist with other containers on this machine.
# Delete this file before deploying to the server.
services:
  frontend:
    ports:
      - "3000:3000"
