services:
  postgres:
    image: postgres:16-alpine
    container_name: spare-parts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spareparts
      POSTGRES_USER: spare_partner_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spare_partner_user -d spareparts"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file: ./backend/.env
    environment:
      - TZ=${APP_TIMEZONE:-Europe/Stockholm}
      # DATABASE_URL comes from backend/.env — use hostname 'postgres' (the service name),
      # not 'localhost'. Special chars in the password must be URL-encoded (@ → %40).
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - ./shared:/app/shared
      - frontend_node_modules:/app/node_modules
    environment:
      - BACKEND_URL=http://backend:3001
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3001
      - NEXT_PUBLIC_APP_TIMEZONE=${APP_TIMEZONE:-Europe/Stockholm}
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_node_modules:
  postgres_data:
