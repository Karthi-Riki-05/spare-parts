services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: spare-parts-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spareparts}
      POSTGRES_USER: ${POSTGRES_USER:-spare_partner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spare_partner_user} -d ${POSTGRES_DB:-spareparts}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Express backend ─────────────────────────────────────────────
  # NOT exposed externally. All traffic arrives via Caddy → frontend
  # (Next.js rewrites) → backend. The backend port 3001 is internal only.
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    environment:
      - NODE_ENV=production
      # Force secure cookies now that HTTPS is active via Caddy.
      # Overrides whatever COOKIE_SECURE value is in backend/.env.
      - COOKIE_SECURE=true
      # Restrict CORS to the production domain.
      # The backend isn't externally reachable but this is defence-in-depth.
      - CORS_ORIGIN=https://spare-parts.tawdev.com
      # DATABASE_URL comes from backend/.env — use hostname 'postgres', URL-encode
      # special chars in the password (@ → %40, # → %23, etc.)
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Next.js frontend ────────────────────────────────────────────
  # Not exposed externally — Caddy proxies to this container on the
  # internal Docker network. No ports: directive here.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Server-side env var used by Next.js rewrites and the SSE route handler.
      # Must use the Docker service name, not localhost or a public domain.
      - BACKEND_URL=http://backend:3001
      - NEXT_PUBLIC_APP_TIMEZONE=${APP_TIMEZONE:-Europe/Stockholm}
      # NEXT_PUBLIC_BACKEND_URL is intentionally omitted.
      # All browser-to-backend traffic flows through Next.js rewrites
      # (/api/* → backend:3001) — the browser never contacts the backend directly.
      # The SSE route handler (app/api/verify/route.ts) also uses server-side
      # BACKEND_URL, not a NEXT_PUBLIC_ variable.
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Caddy reverse proxy (TLS termination) ───────────────────────
  # The only service with public ports. Caddy:
  #   • Obtains and renews TLS certificates from Let's Encrypt automatically
  #   • Redirects HTTP → HTTPS
  #   • Adds security headers (HSTS, X-Frame-Options, etc.)
  #   • Proxies HTTPS traffic to the frontend container on the internal network
  # Requirements before first deploy:
  #   • DNS A record: spare-parts.tawdev.com → this server's public IP
  #   • Ports 80 and 443 open in the server firewall / AWS security group
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2019/config/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  caddy_data:    # TLS certificates and ACME account — must survive container restarts
  caddy_config:  # Caddy compiled runtime config
