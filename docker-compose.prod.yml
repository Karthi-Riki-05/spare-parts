services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file: ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
    environment:
      - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      # குறிப்பு: Backend-ல் /api/health என்ற ரூட் இருப்பதை உறுதி செய்யவும்
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:3000" # மாற்றப்பட்டது: 80-ல் வெப்சைட் தெரியும்
    environment:
      - BACKEND_URL=http://backend:3001
      - NEXT_PUBLIC_BACKEND_URL=http://65.0.212.226:3001 # மாற்றப்பட்டது: உங்கள் IP அட்ரஸ்
    depends_on:
      backend:
        condition: service_healthy
    restart: always