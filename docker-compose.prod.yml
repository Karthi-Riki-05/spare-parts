services:
  postgres:
    image: postgres:16-alpine
    container_name: spare-parts-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spareparts}
      POSTGRES_USER: ${POSTGRES_USER:-spare_partner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperAdmin@2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spare_partner_user} -d ${POSTGRES_DB:-spareparts}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file: ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-spare_partner_user}:${POSTGRES_PASSWORD:-SuperAdmin%402026}@postgres:5432/${POSTGRES_DB:-spareparts}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      # குறிப்பு: Backend-ல் /api/health என்ற ரூட் இருப்பதை உறுதி செய்யவும்
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:3000" # மாற்றப்பட்டது: 80-ல் வெப்சைட் தெரியும்
    environment:
      - BACKEND_URL=http://backend:3001
      - NEXT_PUBLIC_BACKEND_URL=http://65.0.212.226:3001 # மாற்றப்பட்டது: உங்கள் IP அட்ரஸ்
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
